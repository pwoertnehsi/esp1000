<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>ESP1000 Direct Radio</title>
<style type="text/css">
body{margin:6px;background:#132333;color:#eef4ff;font:12px sans-serif}
h1{font-size:17px;margin:0 0 4px} p{margin:3px 0} a{color:#9edaff}
input{width:430px}button,select{font-size:12px;margin:2px 3px 2px 0}textarea{font:12px sans-serif;width:440px;}
.small{font-size:12px;color:#b8cde0}.status{background:#203b50;padding:8px}
</style>
<script language="JavaScript" type="text/javascript">
var espRadio=null,espRadioTimer=null,espRadioSamples=0;
function espRadioText(name,value){document.radioControls.elements[name].value=String(value);}
function espRadioInit(){
 espRadioText('statusText','Initializing native plugin...');
 try{
  espRadio=psp;
  espRadio.sysRadioSetMasterVolume(255);
  espRadio.sysRadioSetSubVolume(255);
  espRadioText('statusText','Ready. Select a source and press Play.');return true;
 }catch(e){espRadio=null;espRadioText('statusText','Initialize: '+e);return false;}
}
function espRadioPreset(){var f=document.radioControls;f.elements['streamUrl'].value=f.elements['source'].value;}
function espRadioPlay(){
 espRadioText('statusText','Play button received.');
 try{
  var url=document.radioControls.elements['streamUrl'].value;
  if(!/^https?:\/\//i.test(url))throw 'Enter an HTTP or HTTPS stream URL.';
  if(!espRadio&&!espRadioInit())return;
  var result=espRadio.sysRadioPlayStream(url,'ESP1000Radio/1.0');
  espRadio.sysRadioSetSubVolume(255);
  espRadioText('statusText',result===0?'Request queued (0). Check Native status below.':'Play request returned '+result+'.');
  espRadioUpdate();
  if(espRadioTimer)clearInterval(espRadioTimer);espRadioTimer=setInterval('espRadioUpdate()',1000);
 }catch(e){espRadioText('statusText','Play: '+e);}
}
function espRadioStop(){
 espRadioText('statusText','Stop button received.');
 try{
  if(espRadioTimer){clearInterval(espRadioTimer);espRadioTimer=null;}
  if(espRadio)espRadio.sysRadioStop();
  espRadioText('statusText','Stopped.');espRadioText('detailsText','');
 }catch(e){espRadioText('statusText','Stop: '+e);}
}
function espRadioUpdate(){
 try{
  var status=espRadio.sysRadioGetPlayerStatus(),title='',buffer='unavailable';
  var labels={'0':'idle','1':'playing','2':'fetching playlist','3':'parsing playlist','4':'connecting','-1':'error'};
  try{buffer=espRadio.sysRadioGetStreamBufferLevel();}catch(ignoredBuffer){}
  try{title=espRadio.sysRadioGetStreamTitle();}catch(ignoredTitle){}
  espRadioText('detailsText','Native: '+status+' ('+(labels[String(status)]||'unknown')+') | Buffer: '+buffer+(title?' | '+title:'')+' | Sample: '+(++espRadioSamples));
 }catch(e){espRadioText('detailsText','Status: '+e);}
}
</script></head><body>
<h1>ESP1000 Direct Radio</h1>
<noscript><p class="status">JavaScript is disabled. Enable JavaScript in the ordinary browser settings, then reopen this player.</p></noscript>

<form name="radioControls" onsubmit="return false;">
<select name="source" onchange="espRadioPreset()">
<option value="http://ice5.somafm.com/groovesalad-128-mp3">Groove Salad MP3 - HTTP test</option>
<option value="https://ice5.somafm.com/groovesalad-128-mp3">Groove Salad MP3 - HTTPS</option>
<option value="http://ice2.somafm.com/groovesalad-128-mp3">Groove Salad MP3 - alternate HTTP test</option>
</select>
<p><input name="streamUrl" type="text" value="http://ice5.somafm.com/groovesalad-128-mp3"></p>
<input type="button" value="Initialize" onclick="espRadioInit()" style="width:90px;">
<input type="button" value="Play" onclick="espRadioPlay()" style="width:90px;">
<input type="button" value="Stop" onclick="espRadioStop()" style="width:90px;">
<input type="button" value="Status" onclick="espRadioUpdate()" style="width:90px;">
<p><textarea name="statusText" rows="1" cols="52" readonly="readonly">JavaScript has not initialized.</textarea></p>
<p><textarea name="detailsText" rows="2" cols="52" readonly="readonly"></textarea></p>
</form>
<p class="small">If HTTP fails, try HTTPS. Stream availability and native codec support still apply.<br>Buffer is native scale 0-255. Use Status if automatic updates stop.</p>
<object name="psp" type="application/x-psp-extplugin"></object>
<script language="JavaScript" type="text/javascript">
espRadioText('statusText','JavaScript is running. Waiting for native plugin...');
setTimeout('espRadioInit()',1500);
</script>
</body></html>
